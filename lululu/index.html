<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加密鹿</title>
  <meta name="description" content="加密鹿 — 一个把文字藏进鹿群密文的小工具，支持密钥加密与一键解密。" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <!-- Open Graph / 微信分享卡片 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="加密鹿 🦌" />
  <meta property="og:description" content="一个把文字藏进鹿群密文的小工具，支持密钥加密与一键解密。" />
  <meta property="og:url" content="https://roylyl.github.io/lululu/" />
  <meta property="og:site_name" content="加密鹿" />
  <meta property="og:image" content="https://roylyl.github.io/lululu/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="加密鹿 🦌" />
  <meta name="twitter:description" content="一个把文字藏进鹿群密文的小工具。" />
  <meta name="twitter:image" content="https://roylyl.github.io/lululu/og-image.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="hero-emoji">🦌</div>
      <h1>加密鹿</h1>
      <p class="subtitle">把文字藏进 <b>鹿群密文</b>，密钥在手才现形</p>
    </div>

    <div class="controls">
      <label class="pwd">
        <span>密钥（解密须相同）</span>
        <input id="pwd" type="text" placeholder="留空也可，但加了更安全" autocomplete="off" />
      </label>
    </div>

    <div class="io">
      <div class="field">
        <div class="field-head">
          <span class="field-label">原文 / 密文</span>
          <span class="count" id="inCount">0 字</span>
        </div>
        <textarea id="input" placeholder="在这里输入要隐藏的文字，或粘贴一段鹿群密文"></textarea>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnEncrypt">鹿加密 🦌</button>
        <button class="btn" id="btnDecrypt">鹿出来 🌿</button>
        <button class="btn ghost" id="btnSmart">智能转换</button>
        <button class="btn ghost" id="btnSwap">交换 ↔</button>
        <button class="btn ghost" id="btnClear">清空</button>
        <button class="btn ghost" id="btnCopy">复制结果</button>
      </div>

      <div class="engine" id="engine" hidden>
        <div class="engine-head">
          <span class="engine-dot"></span>
          <span id="engineTitle">加密引擎</span>
        </div>
        <div class="engine-log" id="engineLog"></div>
        <div class="engine-bar"><div class="engine-bar-fill" id="engineBar"></div></div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">结果</span>
          <span class="count" id="outCount">0 符号</span>
        </div>
        <textarea id="output" readonly placeholder="藏好或现形后的内容会显示在这里"></textarea>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
