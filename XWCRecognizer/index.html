<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f4f2" />
    <meta name="description" content="通过摄像头或照片查看人脸匹配度。" />
    <title>XWCRecognizer</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="vendor/face-api.js"></script>
    <script defer src="vendor/ort/ort.wasm.min.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <h1><a class="brand" href="./">XWC检测器</a></h1>
        <div id="model-line" class="model-line" aria-live="polite" hidden>
          <span id="model-status" class="status-badge">正在加载模型…</span>
          <span id="model-detail" class="model-detail">本机运行</span>
          <button id="retry-model" class="text-button" type="button">重试</button>
        </div>
      </header>
      <main class="workspace-grid">
        <section class="camera-panel" aria-labelledby="camera-title">
          <div class="panel-heading">
            <h2 id="camera-title">画面</h2>
            <label class="camera-device">
              <span class="sr-only">选择摄像头</span>
              <select id="camera-select" aria-label="选择摄像头"><option value="">默认摄像头</option></select>
            </label>
          </div>
          <div class="camera-stage">
            <video id="video" autoplay muted playsinline aria-label="实时摄像头画面"></video>
            <canvas id="still-canvas" aria-label="用于对比的照片" hidden></canvas>
            <canvas id="overlay" aria-hidden="true"></canvas>
            <div id="camera-placeholder" class="camera-placeholder">
              <div id="loading-panel" class="loading-panel" role="status" aria-live="polite">
                <p id="loading-title" class="loading-title">正在加载模型</p>
                <div id="loading-percent" class="loading-percent">0%</div>
                <div id="loading-progress" class="loading-progress" role="progressbar" aria-label="模型加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill" class="loading-fill"></div></div>
                <p id="loading-message" class="loading-message">正在准备</p>
                <button id="loading-retry" class="button" type="button" hidden>重新加载</button>
              </div>
              <div id="idle-placeholder" class="idle-placeholder" hidden>
                <svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="8" width="26" height="19" rx="2"/><path d="m10 8 2-4h8l2 4"/><circle cx="16" cy="17.5" r="5"/></svg>
                <p>摄像头未开启</p>
              </div>
            </div>
          </div>
          <div class="camera-controls">
            <div class="camera-actions">
              <button id="start-camera" class="button button-primary" type="button">开启摄像头</button>
              <button id="stop-camera" class="button" type="button" disabled>停止</button>
              <button id="compare-photo" class="button" type="button">对比照片</button>
              <input id="compare-file" type="file" accept="image/*" hidden/>
            </div>
            <label class="toggle-label"><input id="mirror" type="checkbox" checked/>镜像</label>
          </div>
          <div class="camera-footer">
            <span id="camera-message" aria-live="polite">摄像头未开启</span>
            <div hidden><span id="face-count">0</span><span id="inference-time">—</span></div>
          </div>
        </section>
        <section class="matches-panel" aria-labelledby="matches-title">
          <div class="panel-heading"><h2 id="matches-title">匹配结果</h2><span id="match-summary" aria-live="polite">等待画面</span></div>
          <div class="result-columns" aria-hidden="true"><span>人物</span><span>匹配度</span></div>
          <div id="match-list" class="match-list" aria-live="polite" aria-atomic="false"><div class="empty-state">暂无结果</div></div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
